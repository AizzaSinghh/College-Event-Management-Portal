<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | CampusPulse</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Announcement Strip -->
  <div class="announce-strip">Registrations for Fest Season are now open!</div>

  <!-- Fixed Navigation -->
  <nav class="navbar">
  <a href="../index.html" class="logo">campus<span>pulse</span>.</a>
  <ul class="nav-links">
    <li><a href="../index.html">Home</a></li>
    <li><a href="events.html">Events</a></li>
    <li><a href="clubs.html">Clubs</a></li>
    <li><a href="about.html">About Us</a></li>
    <li><a href="contact.html">Contact Us</a></li>
  </ul>
  <div class="nav-actions">
    <a href="signin.html" class="btn btn-ghost">Sign In</a>
    <a href="signup.html" class="btn btn-primary">Sign Up</a>
  </div>
  <button class="nav-toggle" aria-label="Toggle navigation">
    <span></span><span></span><span></span>
  </button>
</nav>

  <!-- Forgot Password Section -->
  <main class="auth-section">
    <div class="auth-card">
      <span class="section-label">Account Recovery</span>
      <h1 class="auth-heading">forgot your password?</h1>
      <p class="auth-sub">No worries — enter your college email and we'll send you a link to reset it.</p>

      <form class="auth-form" action="#" method="POST">
        <div class="form-group">
          <label for="email">College Email</label>
          <input type="email" id="email" name="email" placeholder="you@college.edu" required>
        </div>

        <button type="submit" class="btn-pill auth-submit">
          <svg class="btn-star" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/>
          </svg>
          Send Reset Link
        </button>
      </form>

      <p class="auth-footer-text">Remembered your password? <a href="signin.html" class="inline-link">Sign In</a></p>
    </div>
  </main>

</body>
</html>
